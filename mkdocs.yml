site_name: Automata for Swords and Hexes (ASH RPG)
site_description: "Player's Handbook, Campaign Record & GM-less Tabletop Ruleset"
site_author: "kostchei"
site_url: "https://kostchei.github.io/ash-rpg/"
repo_url: "https://github.com/kostchei/ash-rpg"
repo_name: "kostchei/ash-rpg"

theme:
  name: material
  palette:
    # Light Mode (Parchment)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark Mode (Obsidian / Slate)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Crimson Pro
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - def_list
  - toc:
      permalink: true
      toc_depth: 3

